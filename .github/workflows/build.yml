name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Android project
        run: |
          set -e
          P=android_project
          J=$P/app/src/main/java/edu/alahnaf/tomjerry
          mkdir -p $J $P/app/src/main/assets $P/app/src/main/res/values
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p $P/app/src/main/res/mipmap-$d
            cp icon.png $P/app/src/main/res/mipmap-$d/ic_launcher.png
          done
          cp index.html $P/app/src/main/assets/index.html
          cat > $P/settings.gradle <<'X'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'TomJerry'
          include ':app'
          X
          cat > $P/build.gradle <<'X'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          X
          cat > $P/app/build.gradle <<'X'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'edu.alahnaf.tomjerry'
              compileSdk 34
              defaultConfig {
                  applicationId 'edu.alahnaf.tomjerry'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          X
          cat > $P/app/src/main/res/values/strings.xml <<'X'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">توم وجيري</string>
          </resources>
          X
          cat > $P/app/src/main/AndroidManifest.xml <<'X'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          X
          cat > $J/MainActivity.java <<'X'
          package edu.alahnaf.tomjerry;

          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(true);
                  web.setWebViewClient(new WebViewClient());
                  web.setOnLongClickListener(v -> true);
                  web.setLongClickable(false);
                  web.setHapticFeedbackEnabled(false);
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onWindowFocusChanged(boolean f) {
                  super.onWindowFocusChanged(f);
                  if (f) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
                  }
              }

              @Override
              protected void onPause() { super.onPause(); web.onPause(); }

              @Override
              protected void onResume() { super.onResume(); web.onResume(); }
          }
          X
      - name: Build APK
        working-directory: android_project
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: tom-jerry-apk
          path: android_project/app/build/outputs/apk/debug/app-debug.apk
          
