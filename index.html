<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>توم وجيري</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f1ea;--fg:#222;--btn:#4c97ff;--btn2:#3373cc;--btnfg:#fff;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181c;--fg:#eee;--btn:#4c97ff;--btn2:#2b5fa8;--card:#24262c}}
:root[data-theme="dark"]{--bg:#17181c;--fg:#eee;--btn:#4c97ff;--btn2:#2b5fa8;--card:#24262c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px;height:100%;overflow:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
html{height:100%}h1{margin:0;font-size:clamp(1rem,3.4vh,1.3rem)}
#wrap{flex:1 1 0;min-height:0;min-width:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}#box{position:relative;flex:none}
canvas{width:100%;height:100%;display:block;background:#fff;border-radius:10px;border:3px solid var(--btn2)}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(0,0,0,.55);border-radius:10px;color:#fff;font-size:1.4rem;text-align:center}
#ov.h{display:none}#hud{width:100%;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:1.15rem;padding:6px 14px;background:var(--card);border:2px solid var(--btn2);border-radius:12px}#ov small{font-size:1.05rem}
.go{font:inherit;font-size:1.2rem;padding:10px 28px;border:0;border-radius:10px;background:var(--btn);color:#fff;cursor:pointer}
#pad{display:grid;--b:clamp(44px,min(17vw,10vh),80px);grid-template-columns:repeat(3,var(--b));grid-template-rows:repeat(2,var(--b));gap:8px;direction:ltr}
#pad button{border:0;border-radius:16px;background:var(--btn);color:var(--btnfg);font-size:calc(var(--b)*.4);box-shadow:0 5px 0 var(--btn2);touch-action:none}
#pad button.on{transform:translateY(4px);box-shadow:0 1px 0 var(--btn2);background:var(--btn2)}
#u{grid-column:2;grid-row:1}#l{grid-column:1;grid-row:2}#d{grid-column:2;grid-row:2}#r{grid-column:3;grid-row:2}
footer{width:100%;max-width:420px;margin-top:4px;padding:6px 10px;border-top:2px solid var(--btn2);text-align:center;font-size:clamp(.65rem,1.8vh,.8rem);line-height:1.6;color:var(--fg);opacity:.9}footer .sch{font-size:.95rem;font-weight:700;color:var(--btn2)}footer .moe{display:block;margin:0 auto 6px;height:clamp(30px,6vh,54px);width:auto}footer b{font-weight:600}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) footer .sch{color:var(--btn)}}:root[data-theme="dark"] footer .sch{color:var(--btn)}
#side{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
@media (orientation:landscape) and (max-height:560px){
body{display:grid;grid-template-columns:minmax(0,1fr) 32vw;grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"t s" "h s" "w s";column-gap:12px;row-gap:6px;align-items:stretch}
h1{grid-area:t;text-align:center}#hud{grid-area:h;justify-self:center}#wrap{grid-area:w}
#side{grid-area:s;justify-content:center;align-self:center}
#pad{--b:clamp(36px,min(18vh,calc((32vw - 26px)/3)),76px)}}
</style></head><body>

const ld=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=s});
const c=document.getElementById('c'),g=c.getContext('2d');
const S=3,bite=new Audio(A.BITE);
const cat={x:-6,y:46,dir:90,size:50,cx:87,cy:39};
const mice=[[173.68,-124.552],[24.384,88.512],[-88.304,41.24],[-189.928,-39.432],[109.744,28.48]].map(p=>({x:p[0],y:p[1],ix:p[0],iy:p[1],dir:90,size:30,cx:50,cy:27,sx:p[0],sy:p[1],tx:0,ty:0,t0:0,hide:0,vis:true}));
let BG,CATI,MOI,keys={},tap={},running=false;
function draw(ctx,img,s){ctx.save();ctx.translate(240+s.x,180-s.y);ctx.rotate((s.dir-90)*Math.PI/180);const k=s.size/100;ctx.scale(k,k);ctx.drawImage(img,-s.cx,-s.cy);ctx.restore()}

 g.drawImage(BG,0,0);draw(g,CATI,cat);for(const m of mice)if(m.vis)draw(g,MOI,m)}
const mk=()=>{const x=document.createElement('canvas');x.width=480;x.height=360;return x.getContext('2d',{willReadFrequently:true})};
const mc=mk(),mc2=mk();
function rect(s){const x0=Math.max(0,Math.floor(240+s.x-130)),y0=Math.max(0,Math.floor(180-s.y-130));return [x0,y0,Math.min(480,x0+260)-x0,Math.min(360,y0+260)-y0]}
function touching(m){
 if(Math.hypot(m.x-cat.x,m.y-cat.y)>200)return false;
 const r=rect(cat);if(r[2]<=0||r[3]<=0)return false;
 mc.clearRect(0,0,480,360);draw(mc,CATI,cat);mc2.clearRect(0,0,480,360);draw(mc2,MOI,m);
 const a=mc.getImageData(...r).data,b=mc2.getImageData(...r).data;
 for(let i=3;i<a.length;i+=4)if(a[i]>10&&b[i]>10)return true;return false}
const D={u:0,d:180,r:90,l:-90},GOAL=20;
let caught=0,t0=0;
const fmt=s=>{s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function upd(now){document.getElementById('cnt').textContent='🐭 '+caught+'/'+GOAL;document.getElementById('tm').textContent='⏱ '+fmt(Math.max(0,(now-t0)/1000))}
function win(now){running=false;for(const m of mice)m.vis=false;upd(now);document.getElementById('msg').innerHTML='أحسنت! أمسكت كل الفئران 🎉<br><small>الوقت: '+fmt((now-t0)/1000)+'</small>';document.getElementById('start').textContent='العب مرة أخرى';document.getElementById('ov').classList.remove('h')}
function newTarget(m,now){m.sx=m.x;m.sy=m.y;m.tx=Math.round(Math.random()*480-240);m.ty=Math.round(Math.random()*360-180);m.t0=now}
function step(now){
 for(const k of ['u','r','l','d']){if(!keys[k]&&!tap[k])continue;tap[k]=false;
  cat.dir=D[k];const rad=cat.dir*Math.PI/180;
  cat.x=Math.max(-240,Math.min(240,cat.x+Math.sin(rad)*10));cat.y=Math.max(-180,Math.min(180,cat.y+Math.cos(rad)*10))}
 for(const m of mice){
  const p=(now-m.t0)/1000;
  if(p>=1){m.x=m.tx;m.y=m.ty;newTarget(m,now)}else{m.x=m.sx+(m.tx-m.sx)*p;m.y=m.sy+(m.ty-m.sy)*p}
  if(!m.vis&&now>=m.hide)m.vis=true;
  if(m.vis&&touching(m)){bite.currentTime=0;bite.play().catch(()=>{});m.vis=false;m.hide=now+3000;caught++;if(caught>=GOAL){win(now);break}}}
 render();if(running)upd(now)}
let last=0;function loop(t){if(running&&t-last>=33){last=t;step(performance.now())}requestAnimationFrame(loop)}
document.getElementById('start').onclick=()=>{
 bite.muted=true;bite.play().then(()=>{bite.pause();bite.currentTime=0;bite.muted=false}).catch(()=>{bite.muted=false});
 const now=performance.now();for(const m of mice){m.x=m.ix;m.y=m.iy;m.vis=true;newTarget(m,now)}caught=0;cat.x=-6;cat.y=46;cat.dir=90;keys={};tap={};t0=now;upd(now);
 running=true;document.getElementById('ov').classList.add('h')};
['u','d','l','r'].forEach(k=>{const b=document.getElementById(k);
 const on=e=>{e.preventDefault();keys[k]=true;tap[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}};
 const off=e=>{keys[k]=false;b.classList.remove('on')};
 b.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,off));
 b.addEventListener('contextmenu',e=>e.preventDefault())});
const wrap=document.getElementById('wrap'),box=document.getElementById('box'),hud=document.getElementById('hud');
function fit(){const w=wrap.clientWidth,h=wrap.clientHeight;if(!w||!h)return;const bw=Math.floor(Math.min(w,h*4/3));box.style.width=bw+'px';box.style.height=Math.floor(bw*3/4)+'px';hud.style.width=bw+'px'}
new ResizeObserver(fit).observe(wrap);addEventListener('resize',fit);fit();
